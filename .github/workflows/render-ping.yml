name: Render Keep-Alive & Ping Test

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier service from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Optional Render Service URL override (leave empty to use RENDER_URL secret)'
        required: false
        default: ''

jobs:
  ping-test:
    name: Back-to-Back Ping Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Execute Back-to-Back Ping
        env:
          TARGET_URL: ${{ inputs.custom_url || secrets.RENDER_URL }}
        run: |
          set -e
          echo "================================================="
          echo "  Render Keep-Alive & Back-to-Back Ping Test     "
          echo "  Time (UTC): $(date -u)                         "
          echo "================================================="

          if [ -z "$TARGET_URL" ]; then
            echo "::error::No Render URL configured!"
            echo "Please add 'RENDER_URL' or 'RENDER_SERVICE_URL' under:"
            echo "Repository Settings -> Secrets and variables -> Actions"
            echo "Example: https://your-backend.onrender.com/api"
            exit 1
          fi

          # Normalize URL
          BASE_URL="${TARGET_URL%/}"
          
          # Automatically resolve endpoint so that base URLs ending in /api or domain correctly ping /api/health
          if [[ "$BASE_URL" == *"/health" ]]; then
            TEST_URL="${BASE_URL}"
          elif [[ "$BASE_URL" == *"/api" ]]; then
            TEST_URL="${BASE_URL}/health"
          else
            TEST_URL="${BASE_URL}/api/health"
          fi

          echo "Target Ping URL: ${TEST_URL}"
          echo ""

          ping_endpoint() {
            local attempt_num=$1
            local url=$2

            echo "▶ Ping #${attempt_num}: Sending request to ${url}..."
            
            # Use curl to capture response body, HTTP status, and duration
            RESPONSE_FILE=$(mktemp)
            HTTP_METRICS=$(curl -s -L -o "$RESPONSE_FILE" \
              -w "%{http_code}:%{time_total}:%{size_download}" \
              --connect-timeout 20 \
              --max-time 60 \
              -H "User-Agent: GitHub-Actions-KeepAlive/1.0" \
              "$url" || echo "000:0.000:0")
            
            HTTP_CODE=$(echo "$HTTP_METRICS" | cut -d: -f1)
            TIME_TOTAL=$(echo "$HTTP_METRICS" | cut -d: -f2)
            SIZE_BYTES=$(echo "$HTTP_METRICS" | cut -d: -f3)
            BODY_PREVIEW=$(head -c 200 "$RESPONSE_FILE" 2>/dev/null || echo "")
            rm -f "$RESPONSE_FILE"

            echo "  └ Status Code: ${HTTP_CODE}"
            echo "  └ Duration   : ${TIME_TOTAL}s"
            echo "  └ Payload    : ${BODY_PREVIEW}"

            echo "${attempt_num}|${HTTP_CODE}|${TIME_TOTAL}s|${BODY_PREVIEW}"
          }

          echo "--- Performing 1st Ping (Wake-up / Cold check) ---"
          PING1_RESULT=$(ping_endpoint 1 "$TEST_URL")
          HTTP1=$(echo "$PING1_RESULT" | cut -d'|' -f2)
          TIME1=$(echo "$PING1_RESULT" | cut -d'|' -f3)
          BODY1=$(echo "$PING1_RESULT" | cut -d'|' -f4)

          # Wait 5 seconds before back-to-back follow-up ping
          echo ""
          echo "Waiting 5 seconds before back-to-back ping..."
          sleep 5

          echo ""
          echo "--- Performing 2nd Ping (Warm verification) ---"
          PING2_RESULT=$(ping_endpoint 2 "$TEST_URL")
          HTTP2=$(echo "$PING2_RESULT" | cut -d'|' -f2)
          TIME2=$(echo "$PING2_RESULT" | cut -d'|' -f3)
          BODY2=$(echo "$PING2_RESULT" | cut -d'|' -f4)

          echo ""
          echo "================================================="
          echo "  Results Summary                                "
          echo "================================================="
          echo "Ping 1 -> HTTP ${HTTP1} in ${TIME1}"
          echo "Ping 2 -> HTTP ${HTTP2} in ${TIME2}"

          # Publish GitHub Step Summary
          {
            echo "### 🚀 Render Keep-Alive & Ping Test Summary"
            echo "- **Target URL:** \`${TEST_URL}\`"
            echo "- **Triggered At (UTC):** $(date -u)"
            echo ""
            echo "| Ping Attempt | HTTP Status | Response Time | Response Preview |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Ping #1 (Initial)** | \`${HTTP1}\` | ${TIME1} | \`${BODY1}\` |"
            echo "| **Ping #2 (Back-to-Back)** | \`${HTTP2}\` | ${TIME2} | \`${BODY2}\` |"
            echo ""
            if [ "$HTTP2" -ge 200 ] && [ "$HTTP2" -lt 400 ]; then
              echo "✅ **Service is awake, responsive, and operational!**"
            elif [ "$HTTP1" -ge 200 ] && [ "$HTTP1" -lt 400 ]; then
              echo "⚠️ **Service responded on Ping 1 but Ping 2 had issues.**"
            else
              echo "❌ **Service is not responding with healthy HTTP status.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Evaluate overall success (at least one valid HTTP response)
          if [ "$HTTP1" -ge 200 ] && [ "$HTTP1" -lt 400 ] || [ "$HTTP2" -ge 200 ] && [ "$HTTP2" -lt 400 ]; then
            echo "✅ Keep-alive ping test passed!"
            exit 0
          else
            echo "::error::Both ping attempts failed or returned non-success HTTP status."
            exit 1
          fi
