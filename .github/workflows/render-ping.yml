name: Render Keep-Alive & Ping Test

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier service from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Optional URL override (e.g. https://example.onrender.com/api/health)'
        required: false
        default: ''

jobs:
  ping-test:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        env:
          INPUT_URL: ${{ inputs.custom_url || secrets.RENDER_URL || 'https://self-test-exam-platform.onrender.com' }}
        run: |
          set -e

          # Ensure the URL always resolves to /api/health
          RAW_URL="${INPUT_URL%/}"
          if [[ "$RAW_URL" == *"/api/health" ]]; then
            TARGET_URL="$RAW_URL"
          elif [[ "$RAW_URL" == *"/api" ]]; then
            TARGET_URL="${RAW_URL}/health"
          elif [[ "$RAW_URL" == *"/health" ]]; then
            TARGET_URL="$RAW_URL"
          else
            TARGET_URL="${RAW_URL}/api/health"
          fi

          echo "========================================="
          echo "  Render Keep-Alive Ping Test"
          echo "  Target URL: $TARGET_URL"
          echo "  Time (UTC): $(date -u)"
          echo "========================================="

          # Ping 1 (Wake-up ping)
          echo "▶ Ping 1: Sending request..."
          HTTP_1=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 20 --max-time 60 "$TARGET_URL" || echo "000")
          echo "  └ Status Code: $HTTP_1"

          # Wait 5 seconds before back-to-back ping
          echo ""
          echo "Waiting 5 seconds..."
          sleep 5

          # Ping 2 (Back-to-back ping)
          echo "▶ Ping 2: Sending back-to-back request..."
          HTTP_2=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 20 --max-time 60 "$TARGET_URL" || echo "000")
          echo "  └ Status Code: $HTTP_2"

          echo ""
          echo "========================================="

          # Check if either ping returned success (2xx or 3xx)
          if ([ "$HTTP_1" -ge 200 ] 2>/dev/null && [ "$HTTP_1" -lt 400 ] 2>/dev/null) || \
             ([ "$HTTP_2" -ge 200 ] 2>/dev/null && [ "$HTTP_2" -lt 400 ] 2>/dev/null); then
            echo "✅ Keep-alive successful! Service is alive and healthy."
            exit 0
          else
            echo "❌ Keep-alive failed (Ping 1: $HTTP_1, Ping 2: $HTTP_2)"
            exit 1
          fi
